[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "templatevue"
dynamic = ["version"]
description = "Copier template for Vue 3 / TypeScript deployable web apps"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Lars B. Rollik", email = "l.b.rollik@protonmail.com"},
]
keywords = ["copier", "template", "vue", "typescript", "docker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/larsrollik/templatevue"
Documentation = "https://larsrollik.github.io/templatevue"
Repository = "https://github.com/larsrollik/templatevue"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.2.6"

[tool.hatch.build.targets.wheel.force-include]
"copier.yaml" = "templatevue/copier.yaml"
"template" = "templatevue/template"

[tool.hatch.build.targets.sdist]
include = ["copier.yaml", "template", "README.md", "VERSION"]

[tool.commitizen]
version_provider = "commitizen"
version = "0.4.0"
version_files = ["VERSION"]
tag_format = "v$version"
update_changelog_on_bump = false

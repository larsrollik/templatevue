name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build image, push to GHCR, GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Docker image ──────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/[[ github_username ]]/[[ github_repo ]]
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Squash merge main → prod ──────────────────────────────────────────
      - name: Squash merge main → prod
        run: |
          git fetch origin

          if git ls-remote --exit-code --heads origin prod > /dev/null 2>&1; then
            git checkout prod
            git pull origin prod
          else
            git checkout -b prod
          fi

          git merge --squash origin/main || true
          git checkout -f origin/main -- .
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to squash-merge."
          else
            git commit -m "release: ${{ github.ref_name }}"
            git push origin prod
          fi

      # ── GitHub release ────────────────────────────────────────────────────
      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" \
              --pretty=format:"- %s" --no-merges \
              | grep -v "^- chore: release" || true)
          else
            NOTES=$(git log --pretty=format:"- %s" --no-merges \
              | grep -v "^- chore: release" || true)
          fi

          [ -z "$NOTES" ] && NOTES="No changes recorded."

          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"       >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "${{ steps.notes.outputs.content }}"

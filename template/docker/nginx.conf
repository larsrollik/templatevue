server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — required for Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app entry point or the runtime config
    location ~* ^/(index\.html|config\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Cache Vite-fingerprinted assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

name: Release

# Publish only: build the image, push to GHCR, and cut a GitHub release.
# Triggered by a tag (hand-pushed tags publish directly) or by a
# workflow_dispatch from versioning.yml (a GITHUB_TOKEN-pushed tag cannot
# trigger push:tags). Merge to main is the only release path — no promotion branch.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true

permissions:
  contents: write
[% if enable_docker_publishing %]
  packages: write
[% endif %]

jobs:
  release:
    name: Build image, push to GHCR, GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ github.event.inputs.tag || github.ref }}"
          fetch-depth: 0

[% if enable_docker_publishing %]
      - name: Compute image tags
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          MAJMIN="$(echo "$VER" | cut -d. -f1-2)"
          IMG="ghcr.io/[[ github_username ]]/[[ github_repo ]]"
          {
            echo "tags<<EOF"
            echo "${IMG}:${VER}"
            echo "${IMG}:${MAJMIN}"
            echo "${IMG}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
[% endif %]

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.tag || github.ref_name }}" \
            --title "Release ${{ github.event.inputs.tag || github.ref_name }}" \
            --generate-notes

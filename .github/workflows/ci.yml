name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate template
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate copier.yaml syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('copier.yaml'))"
          echo "copier.yaml: valid"

      - name: Check template structure
        run: |
          test -f template/index.html
          test -f template/Dockerfile
          test -f template/docker-compose.yml
          test -f template/docker/nginx.conf
          test -f template/docker/40-runtime-config.sh
          test -f template/public/config.json
          test -f template/src/main.ts
          test -f template/src/App.vue
          test -f template/src/config.ts
          test -f template/src/env.d.ts
          test -f template/public/favicon.svg
          test -f template/tsconfig.app.json
          test -f template/tsconfig.node.json
          test -f template/package.json
          test -f template/vite.config.ts
          test -f "template/.github/workflows/ci.yml"
          test -f "template/.github/workflows/versioning.yml"
          test -f "template/.github/workflows/release.yml"
          test -f "template/.github/workflows/docs.yml"
          echo "All expected template files present."

      - name: Validate non-template YAML files
        run: |
          python3 -c "
          import yaml, pathlib, sys
          errors = []
          for p in pathlib.Path('template').rglob('*.yml'):
              text = p.read_text()
              if '[[' in text or '{%' in text:
                  continue
              try:
                  yaml.safe_load(text)
              except yaml.YAMLError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('All non-template YAML files valid.')
          "

      - name: Check key template content
        run: |
          # app mode — no build.lib
          ! grep -q "build\.lib" template/vite.config.ts
          # no npm distribution fields
          ! grep -q '"main"' template/package.json
          ! grep -q '"exports"' template/package.json
          # private flag set
          grep -q '"private": true' template/package.json
          # tsconfig project references
          grep -q "tsconfig.app.json" template/tsconfig.json
          grep -q "tsconfig.node.json" template/tsconfig.json
          # vite/client types declared
          grep -q "vite/client" template/src/env.d.ts
          # Docker build/push and GHCR in release workflow
          grep -q "docker/build-push-action" "template/.github/workflows/release.yml"
          grep -q "ghcr\.io" "template/.github/workflows/release.yml"
          # runtime config entrypoint wired into Dockerfile
          grep -q "40-runtime-config\.sh" template/Dockerfile
          # SPA fallback in nginx config
          grep -q "try_files" template/docker/nginx.conf
          echo "All content checks passed."

      - name: Generate test project
        run: |
          pip install copier
          copier copy --vcs-ref HEAD . /tmp/test-output --defaults --trust \
            --data "project_name=Test App" \
            --data "project_slug=test-app" \
            --data "project_pascal=TestApp" \
            --data "project_description=A test app" \
            --data "author_name=Test Author" \
            --data "author_email=test@example.com" \
            --data "github_username=testuser" \
            --data "github_repo=test-app" \
            --data "node_requires=22" \
            --data "traefik_host=test-app.example.com" \
            --data "secret_config_path=/run/secrets/test-app-config.json" \
            --data "year=2026"

      - name: Check generated project
        run: |
          echo "=== generated files ===" && find /tmp/test-output -not -path '*/.git/*' | sort
          test -f /tmp/test-output/index.html                              && echo "ok: index.html"
          test -f /tmp/test-output/Dockerfile                              && echo "ok: Dockerfile"
          test -f /tmp/test-output/docker-compose.yml                      && echo "ok: docker-compose.yml"
          test -f /tmp/test-output/docker/nginx.conf                       && echo "ok: docker/nginx.conf"
          test -f /tmp/test-output/docker/40-runtime-config.sh             && echo "ok: docker/40-runtime-config.sh"
          test -f /tmp/test-output/src/main.ts                             && echo "ok: src/main.ts"
          test -f /tmp/test-output/src/App.vue                             && echo "ok: src/App.vue"
          test -f /tmp/test-output/src/config.ts                           && echo "ok: src/config.ts"
          test -f /tmp/test-output/src/env.d.ts                            && echo "ok: src/env.d.ts"
          test -f /tmp/test-output/public/favicon.svg                      && echo "ok: public/favicon.svg"
          test -f /tmp/test-output/tsconfig.app.json                       && echo "ok: tsconfig.app.json"
          test -f /tmp/test-output/tsconfig.node.json                      && echo "ok: tsconfig.node.json"
          test -f /tmp/test-output/public/config.json                      && echo "ok: public/config.json"
          test -f /tmp/test-output/.github/workflows/ci.yml                && echo "ok: ci.yml"
          test -f /tmp/test-output/.github/workflows/release.yml           && echo "ok: release.yml"
          grep -q "test-app" /tmp/test-output/package.json                 && echo "ok: slug in package.json"
          grep -q "Test App" /tmp/test-output/src/App.vue                  && echo "ok: name in App.vue"
          grep -q "test-app.example.com" /tmp/test-output/docker-compose.yml          && echo "ok: traefik_host in docker-compose"
          grep -q "test-app-config.json" /tmp/test-output/docker/40-runtime-config.sh && echo "ok: secret_config_path in entrypoint"
          grep -q "ghcr.io/testuser/test-app" /tmp/test-output/.github/workflows/release.yml && echo "ok: GHCR image in release.yml"
          echo "Generated project checks passed."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Run pre-commit (whitespace + gitleaks)
        run: uvx pre-commit run --all-files --show-diff-on-failure

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [validate, lint]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.validate.result }}" != "success" && "${{ needs.validate.result }}" != "skipped" ]]; then
            echo "validate failed" && exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" && "${{ needs.lint.result }}" != "skipped" ]]; then
            echo "lint failed" && exit 1
          fi
          echo "All required checks passed."

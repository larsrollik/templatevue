name: Release

# Publish a GitHub release for a tag. Triggered by a tag push (hand-pushed tags
# release directly) or workflow_dispatch from versioning.yml (automatic path,
# since a GITHUB_TOKEN-pushed tag can't trigger push:tags). No PyPI (Vue app).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.event.inputs.tag || github.ref }}"
          fetch-depth: 0
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: false

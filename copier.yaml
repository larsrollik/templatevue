# templatevue — copier template configuration
# Usage: copier copy gh:larsrollik/templatevue my-new-project
# Update: copier update (inside an existing generated project)

_subdirectory: template
# Render every file's content. Template files carry no `.jinja` suffix; copier
# >=9.2 defaults `_templates_suffix` to ".jinja", which would copy files
# verbatim and leak literal [[ ]] tokens into generated projects.
_templates_suffix: ""
_min_copier_version: "9.0"
_answers_file: .copier-answers.yml

# Use [[ ]] delimiters to avoid conflicts with GitHub Actions ${{ }} syntax.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"

# Make husky hooks executable after copy
_tasks:
  - "chmod +x .husky/pre-commit .husky/commit-msg 2>/dev/null || true"

# ---------------------------------------------------------------------------
# Questions
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: "Human-readable project name (e.g. 'My Vue Component')"

project_slug:
  type: str
  help: "npm package name — lowercase, hyphens (e.g. 'my-vue-component')"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

project_pascal:
  type: str
  help: "PascalCase name for Vue component (e.g. 'MyVueComponent')"
  default: "{{ project_name | title | replace(' ', '') | replace('-', '') | replace('_', '') }}"

project_description:
  type: str
  help: "Short one-line description"

author_name:
  type: str
  help: "Your full name"

author_email:
  type: str
  help: "Your email address"

github_username:
  type: str
  help: "GitHub username or organization"

github_repo:
  type: str
  help: "GitHub repository name"
  default: "{{ project_slug }}"

node_requires:
  type: str
  help: "Minimum Node.js version"
  default: "24"
  choices:
    - "20"
    - "22"
    - "24"

traefik_host:
  type: str
  help: "Hostname for Traefik router rule (e.g. 'myapp.example.com')"
  default: "{{ project_slug }}.example.com"

secret_config_path:
  type: str
  help: "Container path where the runtime secrets JSON file will be mounted"
  default: "/run/secrets/{{ project_slug }}-config.json"

year:
  type: str
  help: "Copyright year"
  default: "{{ '%Y' | strftime }}"

license_type:
  type: str
  help: "Licence for the generated project. noncommercial = custom MSW licence (research/academic only, no commercial use without agreement). bsd3 = BSD-3-Clause (allows commercial use — use for deployables with no research IP)."
  choices:
    "Custom noncommercial (MSW default)": noncommercial
    "BSD-3-Clause (deployable apps / no research IP)": bsd3
  default: noncommercial

enable_docker_publishing:
  type: bool
  help: "Build and push the container image to GHCR from the release workflow? Off keeps the GitHub release but drops the image build/push (and the packages:write permission)."
  default: false

enable_docs_publishing:
  type: bool
  help: "Add the Docs workflow that deploys the site to GitHub Pages on push? Off omits the deploy workflow (build locally regardless)."
  default: false

enable_llm_pr_review:
  type: bool
  help: "Add the optional LLM PR-review workflow (Claude/Ollama, commented templates)? Off omits the workflow and its 'not configured' placeholder check."
  default: false
